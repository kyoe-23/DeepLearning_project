<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자유게시판</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container {
            max-width: 1400px;
        }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .board-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .post-list {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .post-list th,
        .post-list td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .post-list th {
            background-color: #f5f5f5;
            font-weight: bold;
        }

        .post-list tr:hover {
            background-color: #f9f9f9;
            cursor: pointer;
        }

        .post-title {
            color: #333;
            text-decoration: none;
        }

        .post-title:hover {
            color: #007bff;
            text-decoration: underline;
        }

        .post-meta {
            display: flex;
            gap: 10px;
            font-size: 0.9em;
            color: #666;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state h3 {
            margin-bottom: 10px;
        }

        button.primary {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button.primary:hover {
            background-color: #0056b3;
        }

        button.secondary {
            background-color: #6c757d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button.secondary:hover {
            background-color: #5a6268;
        }

        .text-center {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="board-header">
            <h1>자유게시판</h1>
            <div class="user-info">
                <span id="user-name"></span>
                <button id="profile-button" class="secondary">프로필</button>
                <button id="logout-button" class="secondary">로그아웃</button>
            </div>
        </div>

        <div class="board-actions">
            <button id="write-button" class="primary">글쓰기</button>
            <button id="refresh-button" class="secondary">새로고침</button>
        </div>

        <div id="post-list-container">
            <table class="post-list" id="post-table">
                <thead>
                    <tr>
                        <th style="width: 60px;">번호</th>
                        <th>제목</th>
                        <th style="width: 120px;">작성자</th>
                        <th style="width: 80px;">조회수</th>
                        <th style="width: 80px;">좋아요</th>
                        <th style="width: 150px;">작성일</th>
                    </tr>
                </thead>
                <tbody id="post-list-body">
                    <!-- 게시글 목록이 여기에 동적으로 추가됩니다 -->
                </tbody>
            </table>
            <div id="empty-state" class="empty-state" style="display: none;">
                <h3>게시글이 없습니다</h3>
                <p>첫 번째 글을 작성해보세요!</p>
            </div>
        </div>

        <div id="message-box" class="message"></div>
    </div>

    <script src="board.js"></script>
</body>
</html>
